[package]
name = "parastation-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
parastation-core = { path = "../parastation-core" }
rand = "0.8"
image = "0.24"
glow = "0.13"
glutin = "0.31"
glutin-winit = "0.4"
winit = { version = "0.29", features = ["rwh_05"] }
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.5.2"
cpal = "0.17"
ringbuf = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true