[package]
name = "parastation-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
parastation-core = { path = "../parastation-core" }
glow = "0.14"
wasm-bindgen = "0.2"
bytemuck = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "HtmlElement",
    "OffscreenCanvas",
    "HtmlInputElement",
    "Element",
    "Event",
    "FileList",
    "File",
    "WebGl2RenderingContext",
    "DedicatedWorkerGlobalScope",
    "FileReaderSync",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1" # so wasm panics show real messages in the browser console instead of "unreachable"

[build]
target = "wasm32-unknown-unknown"